{% extends "base.html" %}

{% block title %}404 — Page Not Found — JobPortal{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-20rem)] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full text-center">
    <div class="w-20 h-20 rounded-3xl bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-6 text-3xl font-extrabold shadow-sm">
      404
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Page Not Found</h1>
    <p class="mt-3 text-slate-500 text-sm leading-relaxed">
      The page or job position you are looking for doesn't exist, has been removed, or has moved to another address.
    </p>
    <div class="mt-8 flex justify-center gap-3">
      <a href="{{ url_for('home') }}" class="btn btn-primary btn-sm">
        <i class="fa-solid fa-house mr-1"></i> Back to Home
      </a>
      <a href="{{ url_for('jobs.list_jobs') }}" class="btn btn-secondary btn-sm">
        <i class="fa-solid fa-magnifying-glass mr-1"></i> Browse Jobs
      </a>
    </div>
  </div>
</div>
{% endblock %}
