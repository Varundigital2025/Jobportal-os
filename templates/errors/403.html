{% extends "base.html" %}

{% block title %}403 — Access Forbidden — JobPortal{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-20rem)] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full text-center">
    <div class="w-20 h-20 rounded-3xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-6 text-3xl font-extrabold shadow-sm">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Access Denied</h1>
    <p class="mt-3 text-slate-500 text-sm leading-relaxed">
      You don't have permission to access this administrative resource or modify this job posting.
    </p>
    <div class="mt-8 flex justify-center gap-3">
      <a href="{{ url_for('home') }}" class="btn btn-primary btn-sm">
        <i class="fa-solid fa-house mr-1"></i> Back to Home
      </a>
      <a href="{{ url_for('auth.login') }}" class="btn btn-secondary btn-sm">
        Log In with Other Account
      </a>
    </div>
  </div>
</div>
{% endblock %}
