{% extends "base.html" %}

{% block title %}500 — Server Error — JobPortal{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-20rem)] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full text-center">
    <div class="w-20 h-20 rounded-3xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-6 text-3xl font-extrabold shadow-sm">
      500
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Internal Server Error</h1>
    <p class="mt-3 text-slate-500 text-sm leading-relaxed">
      An unexpected situation occurred on the platform. The server transaction was safely rolled back.
    </p>
    <div class="mt-8 flex justify-center gap-3">
      <a href="{{ url_for('home') }}" class="btn btn-primary btn-sm">
        <i class="fa-solid fa-house mr-1"></i> Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
