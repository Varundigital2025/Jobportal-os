{% extends "base.html" %}

{% block title %}Reset Password — JobPortal{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-3 shadow-md">
        <i class="fa-solid fa-key text-xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Forgot Password</h1>
      <p class="text-sm text-slate-500 mt-1">Enter your email address to receive password reset instructions</p>
    </div>

    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-md">
      <form action="{{ url_for('auth.forgot_password') }}" method="POST" class="space-y-5">
        <div>
          <label class="form-label" for="reset-email">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="email" id="reset-email" name="email" required autofocus
                   placeholder="you@example.com" class="form-control pl-9 text-sm">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full py-2.5 font-semibold text-sm rounded-xl shadow-xs">
          Send Reset Instructions
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-100 pt-4">
        Remember your password?
        <a href="{{ url_for('auth.login') }}" class="font-semibold text-blue-600 hover:text-blue-700 ml-1">
          Back to Login
        </a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
