{% extends "base.html" %}

{% block title %}Create Job Seeker Account — JobPortal{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-lg w-full">
    
    <!-- Header Title -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-3 shadow-md">
        <i class="fa-solid fa-user-graduate text-xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Create Job Seeker Account</h1>
      <p class="text-sm text-slate-500 mt-1">Register your candidate profile to find jobs and apply directly</p>
    </div>

    <!-- Registration Form Card -->
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-md">
      <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-5" id="register-form">
        <input type="hidden" name="role" value="candidate">

        <!-- Full Name -->
        <div>
          <label class="form-label" for="reg-name">Full Name <span class="text-rose-500">*</span></label>
          <input type="text" id="reg-name" name="name" value="{{ form_data.get('name', '') }}" required
                 placeholder="e.g. Alex Morgan" class="form-control text-sm">
        </div>

        <!-- Email Address -->
        <div>
          <label class="form-label" for="reg-email">Email Address <span class="text-rose-500">*</span></label>
          <input type="email" id="reg-email" name="email" value="{{ form_data.get('email', '') }}" required
                 placeholder="you@example.com" class="form-control text-sm">
        </div>

        <!-- Phone & Location (Two Columns) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" name="phone" value="{{ form_data.get('phone', '') }}"
                   placeholder="+1 (555) 000-0000" class="form-control text-sm">
          </div>
          <div>
            <label class="form-label" for="reg-location">City / Location</label>
            <input type="text" id="reg-location" name="location" value="{{ form_data.get('location', '') }}"
                   placeholder="e.g. Austin, TX" class="form-control text-sm">
          </div>
        </div>

        <!-- Passwords (Two Columns) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label" for="reg-password">Password <span class="text-rose-500">*</span></label>
            <input type="password" id="reg-password" name="password" required minlength="6"
                   placeholder="At least 6 chars" class="form-control text-sm">
          </div>
          <div>
            <label class="form-label" for="reg-confirm">Confirm Password <span class="text-rose-500">*</span></label>
            <input type="password" id="reg-confirm" name="confirm_password" required minlength="6"
                   placeholder="Re-type password" class="form-control text-sm">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-full py-2.5 font-semibold text-sm rounded-xl shadow-xs mt-2">
          <i class="fa-solid fa-user-plus mr-1.5"></i> Register as Job Seeker
        </button>
      </form>
    </div>

    <!-- Login Link -->
    <div class="text-center mt-6 text-sm text-slate-600">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="font-semibold text-blue-600 hover:text-blue-700">
        Log in here
      </a>
    </div>

  </div>
</div>
{% endblock %}
